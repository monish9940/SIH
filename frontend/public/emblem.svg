<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <!-- Outer Gold Base Shield & Institutional Ring -->
  <g id="emblem-base">
    <path d="M 50,5 L 90,20 L 90,65 C 90,95 50,115 50,115 C 50,115 10,95 10,65 L 10,20 Z" fill="#0B192C" stroke="#D97706" stroke-width="3" />
    <circle cx="50" cy="52" r="34" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,2" />
  </g>
  <!-- Ashoka Chakra Symbol -->
  <g id="ashoka-chakra" fill="none" stroke="#F59E0B" stroke-width="1.8">
    <circle cx="50" cy="52" r="14" stroke-width="2" />
    <circle cx="50" cy="52" r="3" fill="#F59E0B" />
    <!-- 24 Spokes Representation -->
    <line x1="50" y1="38" x2="50" y2="66" />
    <line x1="36" y1="52" x2="64" y2="52" />
    <line x1="40.1" y1="42.1" x2="59.9" y2="61.9" />
    <line x1="40.1" y1="61.9" x2="59.9" y2="42.1" />
    <line x1="44.6" y1="38.7" x2="55.4" y2="65.3" />
    <line x1="44.6" y1="65.3" x2="55.4" y2="38.7" />
    <line x1="38.7" y1="44.6" x2="65.3" y2="55.4" />
    <line x1="38.7" y1="55.4" x2="65.3" y2="44.6" />
  </g>
  <!-- Institutional Crest Stars & Pillars -->
  <g id="crest-details" fill="#F59E0B">
    <polygon points="50,15 52,20 57,20 53,23 55,28 50,25 45,28 47,23 43,20 48,20" />
    <path d="M 30,82 L 70,82 L 66,88 L 34,88 Z" />
    <text x="50" y="98" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SATYAMEVA JAYATE</text>
  </g>
</svg>
